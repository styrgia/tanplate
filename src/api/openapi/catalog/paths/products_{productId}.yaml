get:
    tags:
        - catalog
    summary: Get a product.
    operationId: getCatalogProduct
    parameters:
        - name: productId
          in: path
          required: true
          schema:
              type: string
    responses:
        '200':
            description: Product details.
            content:
                application/json:
                    schema:
                        $ref: '../openapi.yaml#/components/schemas/ProductResponse'
        '404':
            description: Product not found.
            content:
                application/json:
                    schema:
                        $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
